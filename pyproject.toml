[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sasguard"
version = "0.1.0"
description = "Verification-guided migration of SAS analytics pipelines to Python"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.2,<3",
    "pydantic>=2.9,<3",
    "pyreadstat>=1.2.8,<2",
    "PyYAML>=6,<7",
    "scikit-learn>=1.5,<2",
    "scipy>=1.13,<2",
    "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.12,<2",
    "pandas-stubs>=2.2,<3",
    "pytest>=8,<9",
    "pytest-cov>=5,<7",
    "ruff>=0.7,<1",
    "types-PyYAML>=6,<7",
]
notebooks = [
    "ipykernel>=6,<7",
    "jupyterlab>=4,<5",
]

[project.scripts]
sasguard = "sasguard.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/sasguard"]
