name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project
        run: python -m pip install --editable ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      - name: Type-check
        run: mypy

      - name: Verify protected artifacts
        run: sasguard verify-integrity

      - name: Test
        run: pytest

  runner-integration:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project
        run: python -m pip install --editable ".[dev]"

      - name: Build isolated runner image
        run: docker build --file Dockerfile.runner --tag sasguard-runner:test .

      - name: Test isolated runner boundaries
        env:
          SASGUARD_RUN_DOCKER_TESTS: "1"
        run: pytest -m docker_integration
