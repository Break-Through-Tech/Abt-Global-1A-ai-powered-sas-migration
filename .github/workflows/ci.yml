name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install locked project dependencies
        run: |
          python -m pip install uv==0.8.22
          uv sync --locked --no-build-isolation --group build --extra dev --no-install-project
          uv sync --locked --no-build-isolation --group build --extra dev

      - name: Verify exported dependency locks
        run: |
          uv export --locked --format requirements-txt --all-extras --all-groups --no-emit-project --output-file requirements.lock
          uv export --locked --format requirements-txt --no-dev --no-default-groups --no-emit-project --output-file requirements-runtime.lock
          git diff --exit-code -- uv.lock requirements.lock requirements-runtime.lock

      - name: Lint
        run: uv run --no-sync ruff check .

      - name: Check formatting
        run: uv run --no-sync ruff format --check .

      - name: Type-check
        run: uv run --no-sync mypy

      - name: Verify protected artifacts
        run: uv run --no-sync sasguard verify-integrity

      - name: Test
        run: uv run --no-sync pytest

  runner-integration:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install locked project dependencies
        run: |
          python -m pip install uv==0.8.22
          uv sync --locked --no-build-isolation --group build --extra dev --no-install-project
          uv sync --locked --no-build-isolation --group build --extra dev

      - name: Build isolated runner image
        run: docker build --file Dockerfile.runner --tag sasguard-runner:test .

      - name: Test isolated runner boundaries
        env:
          SASGUARD_RUN_DOCKER_TESTS: "1"
        run: uv run --no-sync pytest -m docker_integration
